name: revi-keepalive

on:
  schedule:
    - cron: '0 6 * * 4' # weekly, Thursday 06:00 UTC -- staggered from
                         # build-hermes-image.yml's Monday 06:00 UTC so the
                         # two scheduled workflows don't queue at the same time
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    # Must match hermes-triage.yml's pr_review/autonomous jobs exactly (same
    # image). actions/cache fingerprints each entry by a "version" hash that
    # includes the runner's compression toolchain -- a bare ubuntu-latest
    # host and this container produce different fingerprints for the same
    # path/key, so a restore from the host silently misses every real
    # hermes-memory-* entry instead of refreshing it (confirmed live
    # 2026-08-07: a bare-host keepalive run reported "Cache not found" for
    # keys that had just been proven restorable moments earlier from inside
    # this same container image).
    container:
      image: ghcr.io/bookang869/revi-hermes-scratch/hermes-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      # Phase 5.2 (PLAN 5.2): GitHub evicts a cache entry that goes 7 days
      # without being read, regardless of the repo's 10GB cache budget --
      # restoring here on a schedule keeps hermes-memory-* "read recently"
      # even during weeks with zero repository_dispatch triggers (no alerts
      # fired). No checkout, no Hermes invocation, no ANTHROPIC_API_KEY --
      # this job's only side effect is refreshing the matched cache entry's
      # last-accessed timestamp; it never fires alerts and never touches code.
      # key intentionally won't exact-match anything real, so this always
      # falls through to restore-keys and refreshes the newest
      # hermes-memory-<repo>-<run_id> entry -- same fallback restore-keys
      # uses in hermes-triage.yml's own restore step.
      - name: Keepalive-restore Hermes memory cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.hermes
          key: hermes-memory-${{ github.repository }}-keepalive
          restore-keys: |
            hermes-memory-${{ github.repository }}-
