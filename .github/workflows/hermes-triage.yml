name: hermes-triage

on:
  repository_dispatch:
    types: [revi-triage]

jobs:
  # PR_REVIEW is the safe default: runs whenever mode isn't exactly
  # "AUTONOMOUS" (covers unset/invalid values too, per PLAN cross-cutting
  # rule #4). GITHUB_TOKEN_PROD is never referenced in this job's env, so it
  # is absent from the runner environment entirely, not just unused.
  pr_review:
    if: github.event.client_payload.mode != 'AUTONOMOUS'
    runs-on: ubuntu-latest
    # Phase 3.1b: image is pre-baked with Hermes + build deps (GHCR, built by
    # build-hermes-image.yml) so every dispatch pays a fast image pull instead
    # of the ~87s from-scratch installer cost measured in Phase 0.
    container:
      image: ghcr.io/bookang869/revi-hermes-scratch/hermes-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN_HERMES: ${{ secrets.REVI_TOKEN_HERMES }}
      TRACE_ID: ${{ github.event.client_payload.trace_id }}
      ALERT_ID: ${{ github.event.client_payload.alert_id }}
      SERVICE_NAME: ${{ github.event.client_payload.service_name }}
      ERROR_SUMMARY: ${{ github.event.client_payload.error_summary }}
      LOG_CONTEXT: ${{ github.event.client_payload.log_context }}
      REVI_MODE: PR_REVIEW
    steps:
      # persist-credentials: false -- checkout's default leaves its own
      # http.extraheader (default GITHUB_TOKEN) configured in the local git
      # config. Our own promote/merge steps add a second extraheader with
      # the scoped token (HERMES/PROD); git allows multiple, so both get
      # sent and GitHub 400s with "Duplicate header: Authorization" (found
      # 2026-08-03 testing PLAN 4.4 against the real API). Checkout itself
      # still authenticates fine to clone/fetch; it just doesn't leave
      # credentials behind afterward.
      # ref: benchmark-only (revi/docs/observability-part-b.md), empty on
      # every real alert -- an empty string is actions/checkout's own
      # "use the default branch" behavior, so this is a no-op for
      # production traffic. Only a benchmark harness ever sets it, to check
      # out a fault's fixed base_ref tag instead of main.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.ref }}
      # hermes-rehearsal.yml's own copy of this step claims this job
      # doesn't need it because "Confirm Hermes preinstalled" (hermes
      # --version) supposedly adds the safe.directory exception as a side
      # effect -- that assumption is false. Every real AUTONOMOUS/PR_REVIEW
      # dispatch was hitting "fatal: detected dubious ownership" inside
      # hermes-wrapper.sh's own git status check (which decides whether
      # Hermes wrote a sibling test file), silently burning one of Hermes's
      # 3 budgeted attempts on every single run -- found 2026-08-21 tracing
      # why Part B's Python batch exhausted more than expected. Confirmed
      # via GH Actions logs across all 8 live Python trials plus an older
      # Go-era run from the same day.
      - name: Fix git safe.directory (container job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Confirm routing
        run: echo "mode routed to PR_REVIEW (raw client_payload.mode='${{ github.event.client_payload.mode }}')"
      - name: Confirm Hermes preinstalled
        run: hermes --version
      # Phase 5.2 (PLAN 5.2): restore ~/.hermes (skills + session memory,
      # HERMES_HOME default per the installer) from the most recent cache
      # for this repo before Hermes runs, so run N+1 sees skills learned in
      # run N. restore-keys falls back to the newest prefix match when no
      # exact run_id key exists yet -- true on every run, since the key
      # always includes this run's own id.
      - name: Restore Hermes memory cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.hermes
          key: hermes-memory-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            hermes-memory-${{ github.repository }}-
      # Phase 3.5: diagnose + fix + sibling test, gated on independent
      # compile/test verification, up to 3 attempts, escalates on exhaustion.
      # PR promotion on a gated pass is Phase 3.6, below.
      - name: Hermes repair loop
        id: wrapper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVI_ESCALATION_WEBHOOK_URL: ${{ secrets.REVI_ESCALATION_WEBHOOK_URL }}
          REVI_ESCALATION_WEBHOOK_SECRET: ${{ secrets.REVI_ESCALATION_WEBHOOK_SECRET }}
        run: bash scripts/hermes-wrapper.sh
      # Phase 5.2 (PLAN 5.2): persist ~/.hermes back to cache regardless of
      # outcome -- if: always() overrides the implicit success() check so
      # this still runs after an EXHAUSTION exit (wrapper step exits 1).
      # Unique per-run key (never overwritten); the restore step above
      # always resolves to the newest one via restore-keys.
      - name: Save Hermes memory cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.hermes
          key: hermes-memory-${{ github.repository }}-${{ github.run_id }}
      # Phase 3.6: push hermes/hotfix-[alert-id] with GITHUB_TOKEN_HERMES,
      # open (or update) a same-repo PR to main, escalate PR_READY.
      - name: PR_REVIEW promotion
        id: promote
        if: steps.wrapper.outputs.outcome == 'PASSED'
        env:
          REVI_ESCALATION_WEBHOOK_URL: ${{ secrets.REVI_ESCALATION_WEBHOOK_URL }}
          REVI_ESCALATION_WEBHOOK_SECRET: ${{ secrets.REVI_ESCALATION_WEBHOOK_SECRET }}
          SUMMARY: ${{ steps.wrapper.outputs.summary }}
          CONFIDENCE_NOTE: ${{ steps.wrapper.outputs.confidence_note }}
          ATTEMPTS_MADE: ${{ steps.wrapper.outputs.attempts_made }}
        run: bash scripts/promote-pr.sh
      # Phase 3.3: always() so a run reports its outcome whether the steps
      # above succeeded or failed -- PLAN cross-cutting rule #5, no silent
      # failures. REVI_DIGEST_WEBHOOK_URL is unset until Phase 5.1 (tunnel)
      # exists, so this step will fail on a real dispatch until then -- that
      # is expected, not a bug: there is nowhere for it to reach yet.
      # revi/docs/observability-part-a.md: promote-pr.sh's own outcome/
      # escalation_reason (PR_READY) take priority over the wrapper's when
      # both exist -- PR_READY means a PR actually got opened, a more
      # specific fact than "the gate passed." validated/model never change
      # after the wrapper step, so those always read from steps.wrapper.
      - name: Report digest entry
        if: always()
        env:
          REVI_DIGEST_WEBHOOK_URL: ${{ secrets.REVI_DIGEST_WEBHOOK_URL }}
          REVI_WEBHOOK_SECRET: ${{ secrets.REVI_WEBHOOK_SECRET }}
          OUTCOME: ${{ steps.promote.outputs.outcome || steps.wrapper.outputs.outcome || 'FAILED' }}
          SUMMARY: ${{ steps.wrapper.outputs.summary || 'Hermes repair loop step did not produce an outcome' }}
          VALIDATED: ${{ steps.wrapper.outputs.validated || 'false' }}
          MERGED: ${{ steps.promote.outputs.merged || 'false' }}
          ESCALATION_REASON: ${{ steps.promote.outputs.escalation_reason || steps.wrapper.outputs.escalation_reason || '' }}
          ATTEMPTS: ${{ steps.wrapper.outputs.attempts_made || '' }}
          FAILURE_STAGE: ${{ steps.promote.outputs.failure_stage || steps.wrapper.outputs.failure_stage || '' }}
          FAILURE_CLASSIFICATION: ${{ steps.promote.outputs.failure_classification || steps.wrapper.outputs.failure_classification || '' }}
          MODEL: ${{ steps.wrapper.outputs.model || '' }}
        run: bash scripts/report-digest.sh

  # AUTONOMOUS is the narrow positive match -- only exact "AUTONOMOUS" routes
  # here, so an invalid mode can never reach the merge-capable token.
  autonomous:
    if: github.event.client_payload.mode == 'AUTONOMOUS'
    runs-on: ubuntu-latest
    # Phase 3.1b: same pre-baked image as pr_review -- see comment there.
    container:
      image: ghcr.io/bookang869/revi-hermes-scratch/hermes-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN_HERMES: ${{ secrets.REVI_TOKEN_HERMES }}
      GITHUB_TOKEN_PROD: ${{ secrets.REVI_TOKEN_PROD }}
      TRACE_ID: ${{ github.event.client_payload.trace_id }}
      ALERT_ID: ${{ github.event.client_payload.alert_id }}
      SERVICE_NAME: ${{ github.event.client_payload.service_name }}
      ERROR_SUMMARY: ${{ github.event.client_payload.error_summary }}
      LOG_CONTEXT: ${{ github.event.client_payload.log_context }}
      REVI_MODE: AUTONOMOUS
      # Benchmark-only (revi/docs/observability-part-b.md), empty on every
      # real alert -- autonomous-promote.sh treats an empty value as "main"
      # (unchanged behavior). Only a benchmark harness ever sets it, to a
      # per-fault integration branch it resets before every trial, so
      # independent repeat-trial fixes never collide with each other on the
      # same lines of a shared branch.
      MERGE_TARGET: ${{ github.event.client_payload.merge_target }}
    steps:
      # persist-credentials: false -- checkout's default leaves its own
      # http.extraheader (default GITHUB_TOKEN) configured in the local git
      # config. Our own promote/merge steps add a second extraheader with
      # the scoped token (HERMES/PROD); git allows multiple, so both get
      # sent and GitHub 400s with "Duplicate header: Authorization" (found
      # 2026-08-03 testing PLAN 4.4 against the real API). Checkout itself
      # still authenticates fine to clone/fetch; it just doesn't leave
      # credentials behind afterward.
      # ref: benchmark-only (revi/docs/observability-part-b.md), empty on
      # every real alert -- see the same-named comment in the pr_review job
      # above for why this is a no-op for production traffic.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.ref }}
      # See the same-named step in the pr_review job above for why this is
      # needed despite hermes-rehearsal.yml's comment claiming otherwise.
      - name: Fix git safe.directory (container job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Confirm routing
        run: echo "mode routed to AUTONOMOUS"
      # PLAN 6.5: multiple fixture apps (Go, Rust, Node/TS, Python) now
      # coexist in this repo, so which one to boot depends on which service
      # the alert names -- resolves SERVICE_NAME to a boot command/health
      # url via a fixed table (scripts/resolve-boot-command.sh) instead of
      # the single hardcoded pair this used to be.
      - name: Resolve boot command
        run: bash scripts/resolve-boot-command.sh >> "$GITHUB_ENV"
      - name: Confirm Hermes preinstalled
        run: hermes --version
      # Phase 5.2 (PLAN 5.2): restore ~/.hermes (skills + session memory,
      # HERMES_HOME default per the installer) from the most recent cache
      # for this repo before Hermes runs, so run N+1 sees skills learned in
      # run N. restore-keys falls back to the newest prefix match when no
      # exact run_id key exists yet -- true on every run, since the key
      # always includes this run's own id.
      - name: Restore Hermes memory cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.hermes
          key: hermes-memory-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            hermes-memory-${{ github.repository }}-
      # Phase 3.5 (shared with pr_review): diagnose + fix + sibling test,
      # gated on independent compile/test verification, up to 3 attempts,
      # escalates on exhaustion (severity: critical here since REVI_MODE is
      # AUTONOMOUS -- see hermes-wrapper.sh's exhaustion branch).
      - name: Hermes repair loop
        id: wrapper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVI_ESCALATION_WEBHOOK_URL: ${{ secrets.REVI_ESCALATION_WEBHOOK_URL }}
          REVI_ESCALATION_WEBHOOK_SECRET: ${{ secrets.REVI_ESCALATION_WEBHOOK_SECRET }}
        run: bash scripts/hermes-wrapper.sh
      # Phase 5.2 (PLAN 5.2): persist ~/.hermes back to cache regardless of
      # outcome -- if: always() overrides the implicit success() check so
      # this still runs after an EXHAUSTION exit (wrapper step exits 1).
      # Unique per-run key (never overwritten); the restore step above
      # always resolves to the newest one via restore-keys.
      - name: Save Hermes memory cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.hermes
          key: hermes-memory-${{ github.repository }}-${{ github.run_id }}
      # Phase 4.1 (TRD FR-03): boot the patched app and poll REVI_HEALTH_URL
      # for up to 30s. A boot failure pages immediately (APP_BOOT_FAILURE,
      # critical) and blocks the merge steps below.
      - name: Synthetic smoke test
        id: smoke
        if: steps.wrapper.outputs.outcome == 'PASSED'
        env:
          REVI_ESCALATION_WEBHOOK_URL: ${{ secrets.REVI_ESCALATION_WEBHOOK_URL }}
          REVI_ESCALATION_WEBHOOK_SECRET: ${{ secrets.REVI_ESCALATION_WEBHOOK_SECRET }}
          ATTEMPTS_MADE: ${{ steps.wrapper.outputs.attempts_made }}
        run: bash scripts/smoke-test.sh
      # Phase 4.2/4.3 (TRD FR-05): push hermes/hotfix-[alert-id], run the
      # project's full existing test suite (reusing the framework/manifest
      # dir the wrapper already detected), and on a full pass create the
      # merge commit into main via the GitHub REST API (GITHUB_TOKEN_PROD).
      # Not an auto-"Verified"/signed commit and no GPG key is used --
      # corrected 2026-08-03, TRD Sec 5. Any test-grid failure abandons the
      # workspace, force-deletes the branch, and escalates
      # REGRESSION/critical -- main stays untouched either way.
      - name: AUTONOMOUS promotion
        id: promote
        if: steps.wrapper.outputs.outcome == 'PASSED' && steps.smoke.outputs.outcome == 'PASSED'
        env:
          REVI_ESCALATION_WEBHOOK_URL: ${{ secrets.REVI_ESCALATION_WEBHOOK_URL }}
          REVI_ESCALATION_WEBHOOK_SECRET: ${{ secrets.REVI_ESCALATION_WEBHOOK_SECRET }}
          SUMMARY: ${{ steps.wrapper.outputs.summary }}
          CONFIDENCE_NOTE: ${{ steps.wrapper.outputs.confidence_note }}
          ATTEMPTS_MADE: ${{ steps.wrapper.outputs.attempts_made }}
          TEST_COMMAND: ${{ steps.wrapper.outputs.test_command }}
          MANIFEST_DIR: ${{ steps.wrapper.outputs.manifest_dir }}
        run: bash scripts/autonomous-promote.sh
      # Phase 3.3: same always()-guarded digest report as pr_review -- see
      # comment there re: REVI_DIGEST_WEBHOOK_URL depending on Phase 5.1.
      # revi/docs/observability-part-a.md: same chaining pattern as the
      # existing OUTCOME line -- whichever of promote/smoke/wrapper actually
      # ran and hit a failure is the one with a non-empty
      # escalation_reason/failure_stage/failure_classification. validated
      # and model never change after the wrapper step; merged is only ever
      # set true by autonomous-promote.sh's own successful-merge branch.
      - name: Report digest entry
        if: always()
        env:
          REVI_DIGEST_WEBHOOK_URL: ${{ secrets.REVI_DIGEST_WEBHOOK_URL }}
          REVI_WEBHOOK_SECRET: ${{ secrets.REVI_WEBHOOK_SECRET }}
          OUTCOME: ${{ steps.promote.outputs.outcome || steps.smoke.outputs.outcome || steps.wrapper.outputs.outcome || 'FAILED' }}
          SUMMARY: ${{ steps.wrapper.outputs.summary || 'Hermes repair loop step did not produce an outcome' }}
          VALIDATED: ${{ steps.wrapper.outputs.validated || 'false' }}
          MERGED: ${{ steps.promote.outputs.merged || 'false' }}
          ESCALATION_REASON: ${{ steps.promote.outputs.escalation_reason || steps.smoke.outputs.escalation_reason || steps.wrapper.outputs.escalation_reason || '' }}
          ATTEMPTS: ${{ steps.wrapper.outputs.attempts_made || '' }}
          FAILURE_STAGE: ${{ steps.promote.outputs.failure_stage || steps.smoke.outputs.failure_stage || steps.wrapper.outputs.failure_stage || '' }}
          FAILURE_CLASSIFICATION: ${{ steps.promote.outputs.failure_classification || steps.smoke.outputs.failure_classification || steps.wrapper.outputs.failure_classification || '' }}
          MODEL: ${{ steps.wrapper.outputs.model || '' }}
        run: bash scripts/report-digest.sh
