name: hermes-triage

on:
  repository_dispatch:
    types: [revi-triage]

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hermes Agent
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash

      - name: Run Hermes one-shot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRACE_ID: ${{ github.event.client_payload.trace_id }}
          ERROR_SUMMARY: ${{ github.event.client_payload.error_summary }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          PROMPT="You are diagnosing a production crash. trace_id=$TRACE_ID, error_summary=\"$ERROR_SUMMARY\". There is no repository checked out relevant to this crash in this sandbox -- just simulate a plausible one-line diagnosis and treat it as fixed. Respond with ONLY a single literal JSON object, no surrounding prose, matching exactly this schema: {\"confidence_note\": \"string\", \"summary\": \"string\", \"test_framework\": \"string\"}"
          hermes --provider anthropic --model claude-sonnet-5 -z "$PROMPT"
